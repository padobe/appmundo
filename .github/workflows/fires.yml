name: Actualizar focos de calor

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fires:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Recortar focos de FIRMS a los incendios activos de GDACS
        run: node scripts/update-fires.mjs
      - name: Guardar si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/fires
          git diff --staged --quiet || (git commit -m "Actualizar focos de calor" && git push)
